# The robot cell. EVERY value marked CALIBRATE must be measured on the real cell
# before `insert`; the defaults reproduce the simulated cell (tetris/arms.py:
# bases at x -0.05, y -/+0.45 in the shelf frame, base frames unrotated).
#
# THE SHELF FRAME: origin on the shelf floor at the left edge of column 0 (the
# simulator's world), z up, the shelf plane is x-z, the LEFT arm stands at -y,
# the RIGHT arm at +y. The shelf has no front and no back panel: one tool
# reaches the piece from each side.

rate_hz: 100              # control loop and command stream [Hz]
log_dir: logs
max_reach: 0.902          # [m] Kinova Gen3 7-DoF reach, for `check` only
f_abort: 60.0             # [N] per hand: stop streaming above this (robot-only safety)
track_abort: 0.040        # [m] stop if a flange is this far from its target beyond F / KP
allow_hand_wrench: false  # hwd routes chase F/T moments: enable only once they are verified

# the wrist impedance the routes were trained against (lib/wrist.py). Set the
# arm controllers to these; `stiffness_topic` also streams the tilt in use.
stiffness:
  trans: 1500.0           # [N/m]
  torsion: 40.0           # [Nm/rad] about the push axis (tool x)
  # tilt: 3 Nm/rad while approaching, 8 while holding (sent live)

# THE REAL TOOL (Lorenzo, 2026-10-12): two printed plastic plates, a central
# spring, a sponge face. CALIBRATE: measure and write here. The SOCP takes three
# points on a circle of radius r_tri on the sponge face (CONSTRAINT 1's model).
tool:
  pad_x: 0.020            # [m] from the tool origin to the sponge's back (sim: pad centres)
  pad_r: 0.010            # [m] sponge thickness (sim: sphere radius)
  r_tri: 0.030            # [m] radius of the three contact points (sim: 30 mm)

left:
  base_frame: left_base_link
  ee_frame: left_end_effector_link
  target_topic: /left/cartesian_compliance_controller/target_frame
  stiffness_topic: ""     # e.g. /left/impedance/stiffness (Float64MultiArray kx ky kz krx kry krz), "" = off
  wrench_topic: /left/ft_sensor/wrench
  ft_sign: 1.0            # +1 if the sensor reports the load ON the tool; -1 if the reaction
  tool_mass: 0.150        # [kg] CALIBRATE: everything beyond the sensor (plates, spring, sponge)
  tool_com_in_ft: [0.0, 0.0, 0.03]   # [m] CALIBRATE: its centre of mass, sensor frame
  shoulder_in_base: [0.0, 0.0, 0.2848]
  # CALIBRATE: the pose of the SHELF frame in this arm's base frame
  shelf_in_base: {xyz: [0.05, 0.45, 0.0], quat: [0.0, 0.0, 0.0, 1.0]}
  # our tool frame (x = push direction, at the flange centre) in the ee frame:
  # x_tool = z_ee, a -90 deg turn about y. Add the mount offset along z_ee if any.
  tool_in_ee: {xyz: [0.0, 0.0, 0.0], quat: [0.0, -0.7071068, 0.0, 0.7071068]}

right:
  base_frame: right_base_link
  ee_frame: right_end_effector_link
  target_topic: /right/cartesian_compliance_controller/target_frame
  stiffness_topic: ""
  wrench_topic: /right/ft_sensor/wrench
  ft_sign: 1.0
  tool_mass: 0.150
  tool_com_in_ft: [0.0, 0.0, 0.03]
  shoulder_in_base: [0.0, 0.0, 0.2848]
  shelf_in_base: {xyz: [0.05, -0.45, 0.0], quat: [0.0, 0.0, 0.0, 1.0]}
  tool_in_ee: {xyz: [0.0, 0.0, 0.0], quat: [0.0, -0.7071068, 0.0, 0.7071068]}
